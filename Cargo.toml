[package]
name = "dezoomify-rs"
version = "2.16.0"
authors = ["lovasoa"]
edition = "2024"
license-file = "LICENSE"
description = "Allows downloading zoomable images. Supports several different formats such as zoomify, iiif, and deep zoom images."
documentation = "https://docs.rs/dezoomify-rs"
repository = "https://github.com/lovasoa/dezoomify-rs"
homepage = "https://lovasoa.github.io/dezoomify-rs/"
readme = "README.md"
keywords = ["image", "download"]

[features]
default = ["vendored-jxl"]
vendored-jxl = ["jpegxl-rs/vendored"]

[dependencies]
image = "0.25"
jpegxl-rs = { version = "0.14", features = ["image"] }
jpegxl-sys = "0.12"
png = "0.18"
# Tokio features are kept to the minimum needed by the rest of the crate:
#   - rt-multi-thread: the main async runtime for downloads
#   - macros:         #[tokio::main], #[tokio::test], select!, etc.
#   - time:           throttler, timeouts (download_state, throttler)
#   - fs:             tile storage cache (network)
#   - sync:           Mutex/Semaphore/mpsc used by the download coordinator
#   - signal:         graceful shutdown on Ctrl-C
# If you add a feature that needs e.g. `process` or `net`, add it here too.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "signal"] }
bytes = "1"
futures = "0.3"
thiserror = "1"
clap = { version = "4.4.6", features = ["derive"] }
tokio-util = { version = "0.7", features = ["full"] }
lru = "0.12"
evalexpr = "13"
regex = "1"
lazy_static = "1.4"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
# serde_yml is the maintained successor to the unmaintained serde_yaml crate.
serde_yml = "0.0.13"
serde-xml-rs = "0.8"
serde_json = "1.0"
json5 = "1.3"
serde_urlencoded = "0.7"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
indicatif = "0.18"
sanitize-filename-reader-friendly = "2"
colour = "2.1"
human-panic = "2"
log = "0.4"
env_logger = "0.11"
url = "2"
fixedbitset = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "zstd", "charset", "system-proxy"] }

[dev-dependencies]
criterion = "0.8"
image_hasher = "3"
tempfile = "3"

[[bench]]
name = "local_dezoomifying"
harness = false
